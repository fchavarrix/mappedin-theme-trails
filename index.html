<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Rutas temáticas · Mappedin demo</title>
    <meta name="description" content="Elige una ruta temática y un punto azul te lleva por sus tiendas, con cupones en cada parada y beneficios al paso. Demo de navegación interior con Mappedin JS." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rutas temáticas · demo de recorridos en un mall" />
    <meta property="og:description" content="Elige una ruta y un punto azul te lleva por sus tiendas, con cupones en cada parada y beneficios al paso." />
    <meta property="og:url" content="https://theme-trails-demo.atlas-lac.com/" />
    <meta property="og:image" content="https://theme-trails-demo.atlas-lac.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" />
  </head>
  <body>
    <div id="map"></div>

    <header class="topbar">
      <div class="brand">
        <span class="logo">R</span>
        <div>
          <strong id="app-name">Theme trails</strong>
          <small id="subtitle"></small>
        </div>
      </div>
      <div class="controls">
        <button id="score" class="score" type="button"></button>
        <button id="lang" class="lang" type="button"></button>
      </div>
    </header>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <section class="sheet" id="sheet">
      <div class="steps" id="steps">
        <span data-step="choose"></span>
        <span data-step="walk"></span>
        <span data-step="done"></span>
      </div>
      <h1 id="title"></h1>
      <p id="message"></p>
      <div id="body"></div>
      <div class="actions" id="actions"></div>
      <p class="credit" id="credit"></p>
      <p class="credit disclaimer" id="disclaimer"></p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
